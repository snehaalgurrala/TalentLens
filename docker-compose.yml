# ──────────────────────────────────────────────────────────────
#  TalentLens — Local Development Stack
#  Active services: backend · postgres · redis · ai-service · worker
#  Pending services (no Dockerfile yet): frontend
# ──────────────────────────────────────────────────────────────

services:
  # ── Backend API (FastAPI) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentlens-backend
    restart: unless-stopped
    # --reload enables hot-reloading in development via the volume mount below
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: INFO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-talentlens}
      POSTGRES_USER: ${POSTGRES_USER:-talentlens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "http://localhost:3002", "http://127.0.0.1:3000", "http://127.0.0.1:3001"]'
      AI_SERVICE_URL: "http://ai-service:8001"
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      LOCAL_EMBEDDING_DEVICE: ${LOCAL_EMBEDDING_DEVICE:-cpu}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - talentlens-net

  # ── PostgreSQL 16 + pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentlens}
      POSTGRES_USER: ${POSTGRES_USER:-talentlens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentlens_user} -d ${POSTGRES_DB:-talentlens}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - talentlens-net

  # ── Redis 7 ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: talentlens-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - talentlens-net

  # ── Frontend (Next.js) — placeholder, no Dockerfile yet ───
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: talentlens-frontend
  #   ...

  # ── AI Service (resume parser) ───────────────────────────
  ai-service:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: talentlens-ai
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      SENTENCE_TRANSFORMERS_MODEL: ${SENTENCE_TRANSFORMERS_MODEL:-all-MiniLM-L6-v2}
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    volumes:
      - ./ai-services:/app
    networks:
      - talentlens-net

  # ── Celery Worker ─────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentlens-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-talentlens}
      POSTGRES_USER: ${POSTGRES_USER:-talentlens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AI_SERVICE_URL: "http://ai-service:8001"
      AI_SERVICE_TIMEOUT: "30"
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      LOCAL_EMBEDDING_DEVICE: ${LOCAL_EMBEDDING_DEVICE:-cpu}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Celery-native check — this service runs `celery worker`, not the API,
      # so the backend image's HTTP healthcheck (curl localhost:8000) would
      # always fail here since nothing listens on that port. `inspect ping`
      # round-trips through the broker to confirm the worker process is
      # actually consuming tasks, which an HTTP probe can't verify anyway.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - talentlens-net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ── Networks ─────────────────────────────────────────────────
networks:
  talentlens-net:
    driver: bridge

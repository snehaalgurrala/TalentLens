name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend (Python / FastAPI) ──────────────────────────────
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: talentlens
          POSTGRES_USER: talentlens_user
          POSTGRES_PASSWORD: change-me-please
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentlens_user -d talentlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: talentlens
      POSTGRES_USER: talentlens_user
      POSTGRES_PASSWORD: change-me-please
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET: ci-test-secret-not-for-production
      LOCAL_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy .

      - name: Create required Postgres extensions
        run: |
          PGPASSWORD=change-me-please psql -h localhost -U talentlens_user -d talentlens -c \
            'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Run database migrations
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest --tb=short -q

  # ── Frontend (Next.js) ──────────────────────────────────────
  frontend-lint-test:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests (Jest)
        run: npm test -- --passWithNoTests

  # ── AI Services ─────────────────────────────────────────────
  ai-lint-test:
    name: AI Services — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-services
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest --tb=short -q

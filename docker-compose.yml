version: "3.9"

# ──────────────────────────────────────────────────────────────
#  TalentLens — Local Development Stack
#  Active services: backend · postgres · redis
#  Pending services (no Dockerfile yet): frontend · ai-services · worker
# ──────────────────────────────────────────────────────────────

services:
  # ── Backend API (FastAPI) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentlens-backend
    restart: unless-stopped
    # --reload enables hot-reloading in development via the volume mount below
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: INFO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-talentlens}
      POSTGRES_USER: ${POSTGRES_USER:-talentlens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talentlens-net

  # ── PostgreSQL 16 + pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentlens}
      POSTGRES_USER: ${POSTGRES_USER:-talentlens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentlens_user} -d ${POSTGRES_DB:-talentlens}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - talentlens-net

  # ── Redis 7 ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: talentlens-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - talentlens-net

  # ── Frontend (Next.js) — placeholder, no Dockerfile yet ───
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: talentlens-frontend
  #   ...

  # ── AI Services — placeholder, no Dockerfile yet ──────────
  # ai-services:
  #   build:
  #     context: ./ai-services
  #     dockerfile: Dockerfile
  #   container_name: talentlens-ai
  #   ...

  # ── Celery Worker — placeholder, no worker module yet ─────
  # worker:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   command: celery -A app.worker worker --loglevel=info
  #   ...

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ── Networks ─────────────────────────────────────────────────
networks:
  talentlens-net:
    driver: bridge
